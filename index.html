        *{box-sizing:border-box;margin:0;padding:0}
        img{max-width:100%;display:block}
        .container{max-width:1200px;margin:0 auto;padding:0 16px}
        @media(min-width:768px){.container{padding:0 24px}}
        .navy{background:#0F2027}
        .gold{color:#D4AF37}
        .bg-gold{background:#D4AF37}
        .header{position:sticky;top:0;z-index:50;background:#0F2027;border-bottom:2px solid #D4AF37;padding:12px 0}
        .header-inner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}

        .logo-mark{width:44px;height:44px;background:#D4AF37;color:#0F2027;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .logo-text{color:white;font-weight:800;line-height:1;font-size:14px;letter-spacing:0.5px}
        @media(min-width:768px){.logo-text{font-size:15px}.logo-mark{width:48px;height:48px;font-size:20px}}
        .btn-gold{background:#D4AF37;color:#0F2027;padding:10px 18px;font-weight:800;text-decoration:none;display:inline-block;border:none;cursor:pointer;font-size:13px;letter-spacing:0.5px;transition:0.2s}
        .btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
        .btn-outline{border:1.5px solid rgba(255,255,255,0.6);color:white;padding:10px 18px;font-weight:700;text-decoration:none;display:inline-block;background:transparent;cursor:pointer;font-size:13px}
        .service-tabs{display:flex;flex-direction:column;gap:0;border:2px solid #0F2027}
        @media(min-width:768px){.service-tabs{flex-direction:row}}
        .tab{flex:1;padding:18px 20px;background:white;border-bottom:1px solid rgba(15,32,39,0.15);cursor:pointer;transition:0.2s;text-align:left}
        @media(min-width:768px){.tab{border-bottom:none;border-right:1px solid rgba(15,32,39,0.15)}.tab:last-child{border-right:none}}
        .tab.active{background:#0F2027;color:white;border-color:#0F2027}
        .tab.active .tab-title{color:#D4AF37}
        .tab-num{font-size:11px;letter-spacing:2px;opacity:0.6;font-weight:700}
        .tab-title{font-weight:800;margin-top:6px;font-size:14px;line-height:1.2}
        .service-display{display:flex;flex-direction:column;background:#0F2027;color:white;overflow:hidden}
        @media(min-width:900px){.service-display{flex-direction:row;min-height:520px}}
        .service-img-wrap{position:relative;flex:1;min-height:360px;background:#1a2a32;overflow:hidden}
        @media(max-width:899px){.service-img-wrap{min-height:300px}}
        .service-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
        .service-content{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center}
        @media(min-width:768px){.service-content{padding:36px 40px}}
        .badge-gold{background:#D4AF37;color:#0F2027;padding:8px 12px;font-weight:800;font-size:10px;letter-spacing:1.5px;display:inline-block;margin-bottom:14px;line-height:1}
        @media(min-width:768px){.badge-gold{font-size:11px}}
